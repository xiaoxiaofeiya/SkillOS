name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build zip
        run: npm run pack:zip

      - name: Verify zip
        run: node packages/cli/dist/index.js pack verify --format json

      - name: Verify isolated installation
        run: npm run verify:install

      - name: Verify network installation paths
        run: npm run verify:install:network

      - name: Verify publish readiness
        run: npm run verify:publish-readiness

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/skillos.zip
            dist/pack-verification.json
